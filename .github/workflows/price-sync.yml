name: Sync store prices

on:
  schedule:
    # Every day at 05:23 UTC.
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Price sync skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to refresh D1."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh prices from Steam, Nintendo and Xbox
        if: steps.creds.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/sync-prices.cjs --apply

      - name: Keep the dev snapshot in step with D1
        if: steps.creds.outputs.available == 'true'
        run: |
          if ! git diff -U0 -- src/data/catalog.json | grep -qE '^[-+].*"(price|regular_price|on_sale)":'; then
            echo "No price changes since the last run."
            exit 0
          fi
          npm run db:seed:generate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/catalog.json db/seed.sql
          git commit -m "chore: refresh price snapshot"
          git push
